name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  test:
    name: core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo test --release --locked
        working-directory: core

  licenses:
    name: licence policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-deny
        run: |
          curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
      - name: core workspace
        run: cargo-deny --manifest-path core/Cargo.toml --config core/deny.toml check licenses sources bans
      - name: relay
        run: cargo-deny --manifest-path infra/relay/Cargo.toml --config core/deny.toml check licenses sources bans

  advisories:
    # Informational for now: a new RustSec advisory in a transitive libp2p
    # dependency should not block unrelated work. Review the log.
    name: security advisories (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-deny
        run: |
          curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local/bin "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
      - run: cargo-deny --manifest-path core/Cargo.toml --config core/deny.toml check advisories

  relay-image:
    name: relay image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: infra/relay
          push: false
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay
