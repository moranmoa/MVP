name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token everywhere; no job needs to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"
  # SHA-256 of cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz. Bump
  # together with CARGO_DENY_VERSION (value from the release's .sha256 file).
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"

# Third-party actions are pinned to full commit SHAs (tag in the comment):
# a moved or hijacked tag cannot change what runs here. Dependabot
# (.github/dependabot.yml) proposes updates.

jobs:
  test:
    name: core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core
      - run: cargo test --release --locked
        working-directory: core

  updater-windows:
    # The key-file ACL code is `#[cfg(windows)]` (updater, sync keyfile.rs, api data dir): build and
    # test it on Windows so it cannot rot unseen (includes an icacls check).
    name: updater + sync + api tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core
      - run: cargo test --release --locked -p updater -p sync -p api
        working-directory: core

  licenses:
    name: licence policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install cargo-deny (checksum verified)
        run: .github/scripts/install-cargo-deny.sh
      - name: core workspace
        run: cargo-deny --manifest-path core/Cargo.toml --config core/deny.toml check licenses sources bans
      - name: relay
        run: cargo-deny --manifest-path infra/relay/Cargo.toml --config core/deny.toml check licenses sources bans

  advisories:
    # Informational for now: the open advisories are all in libp2p 0.54's
    # tree (see the PR that added this). Make it blocking after the upgrade.
    name: security advisories (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install cargo-deny (checksum verified)
        run: .github/scripts/install-cargo-deny.sh
      - run: cargo-deny --manifest-path core/Cargo.toml --config core/deny.toml check advisories

  ui:
    name: ui build, tests and licences
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    env:
      # Playwright is only used for local screenshots; CI needs no browsers.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Licence policy (lockfile, before installing anything)
        run: node ../.github/scripts/npm-licenses.mjs package-lock.json
      # --ignore-scripts: no dependency gets to run install hooks in CI.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test

  # Electron gets security fixes only for its latest three majors: fail when
  # desktop/ falls more than one major behind or sits on a patch that was
  # superseded more than 8 weeks ago. Talks only to registry.npmjs.org.
  # No-op until desktop/package-lock.json exists (B1-1).
  electron-age:
    name: electron version age
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Check Electron age
        if: hashFiles('desktop/package-lock.json') != ''
        run: node .github/scripts/electron-age.mjs desktop/package-lock.json

  # B10: the qa/ smoke suite (onboarding -> send -> join by link) against a
  # production build of the UI with the mock core, as qa/compose.yaml runs it.
  # The image matches @playwright/test in qa/package-lock.json, pinned by digest.
  qa-smoke:
    name: qa smoke (playwright)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Licence policy (qa lockfile)
        run: node .github/scripts/npm-licenses.mjs qa/package-lock.json
      - name: Build and serve the UI
        working-directory: ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx vite build --outDir /tmp/qa-dist --emptyOutDir --logLevel warn
          nohup npx vite preview --outDir /tmp/qa-dist --host 127.0.0.1 --port 5173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do
            node -e "fetch('http://localhost:5173/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))" && exit 0
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Smoke suite
        working-directory: qa
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright test --project=smoke

  relay-image:
    name: relay image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: infra/relay
          push: false
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay
