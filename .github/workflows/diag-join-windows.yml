# Diagnostics for the 0.3.1 join failure on Windows (P0, 2026-11-10). Not a
# required check; runs only on pushes to diag/join-windows. Two peers (in
# one process, tests/two_peers.rs) join and chat through a local relay
# built from infra/relay, on windows-latest, over TCP and over plain ws (the
# app's path behind the TLS proxy), at current main and at v0.2.5.
name: diag join (Windows)
on:
  push:
    branches: [diag/join-windows]
permissions:
  contents: read
jobs:
  join:
    name: join ${{ matrix.ref }} over ${{ matrix.transport }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ref: [diag, v0.2.5]
        transport: [tcp, ws]
        exclude:
          # 0.2.5 takes no plain /ws relay address (InvalidMultiaddr).
          - ref: v0.2.5
            transport: ws
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: relay-src
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ matrix.ref == 'diag' && github.sha || matrix.ref }}
          path: core-src
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            relay-src/infra/relay
            core-src/core
          key: ${{ matrix.ref }}
      - name: Build the relay (infra/relay, current branch)
        run: cargo build --release --locked --manifest-path relay-src/infra/relay/Cargo.toml
      - name: Build the two-peer tests
        working-directory: core-src/core
        run: cargo test --release --locked -p api --test two_peers --no-run
      - name: Start the relay
        run: |
          export KEY_PATH="$RUNNER_TEMP/relay.key" TCP_PORT=4001 QUIC_PORT=4001 WS_PORT=4002 \
            ALLOW_PRIVATE_ADDRS=1 EXTERNAL_ADDRS=/ip4/127.0.0.1/tcp/4001,/ip4/127.0.0.1/tcp/4002/ws RUST_LOG=info
          ./relay-src/infra/relay/target/release/*relay*.exe > "$RUNNER_TEMP/relay.log" 2>&1 &
          for _ in $(seq 60); do
            id=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/relay.log" | grep -o 'relay node started peer_id=[A-Za-z0-9]*' | cut -d= -f2 || true)
            [ -n "$id" ] && break
            sleep 1
          done
          [ -n "$id" ] || { cat "$RUNNER_TEMP/relay.log"; exit 1; }
          if [ "${{ matrix.transport }}" = ws ]; then
            echo "RELAY=/ip4/127.0.0.1/tcp/4002/ws/p2p/$id" >> "$GITHUB_ENV"
          else
            echo "RELAY=/ip4/127.0.0.1/tcp/4001/p2p/$id" >> "$GITHUB_ENV"
          fi
      - name: Two peers join and chat through the relay
        # pwsh, not Git Bash: MSYS rewrites /ip4/... env values into Windows paths.
        shell: pwsh
        working-directory: core-src/core
        env:
          RUST_LOG: info,sync=debug,api=debug,mvs=info
        run: |
          cargo test --release --locked -p api --test two_peers -- --ignored --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/two_peers.log"
          exit $LASTEXITCODE
      - name: Relay log
        if: always()
        run: sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/relay.log" | tail -200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: diag-join-${{ matrix.ref }}-${{ matrix.transport }}
          path: |
            ${{ runner.temp }}/relay.log
            ${{ runner.temp }}/two_peers.log
