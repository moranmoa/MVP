name: Install tests

# T12: install / update / uninstall checks on the packaged shells, both
# candidates (Tauri and Electron), Windows and Linux. Checklist and what each
# step proves: docs/release/INSTALL-TESTS.md. QA's manual pass covers the
# rest (qa/TEST_PLAN.md section 14).

on:
  pull_request:
    paths:
      - packaging/install-tests/**
      - spikes/shell/**
      - .github/workflows/install-tests.yml
  workflow_dispatch:
    inputs:
      packages_ref:
        description: Ref whose spikes/shell/build-packages.sh builds the packages (empty = this ref)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: install-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: build packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ inputs.packages_ref }}
      - name: Build five packages (Docker; the Electron installer is built on Windows)
        env:
          CARGO_BUILD_JOBS: "4"
          # electron-builder's NSIS step runs wine, which the runner's Docker
          # refuses ("wine: socket : Function not implemented").
          ELECTRON_WINDOWS: "0"
        run: |
          git log -1 --format='packages from %H'
          bash spikes/shell/build-packages.sh "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/packages/shell-*
          if-no-files-found: error
          retention-days: 3

  electron-windows:
    name: build electron installer (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ inputs.packages_ref }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Build ui/dist
        working-directory: ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Build the NSIS installer
        working-directory: spikes/shell/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned on purpose
        run: |
          npm ci --no-audit --no-fund
          npx electron-builder --win nsis --publish never
          mkdir -p "$RUNNER_TEMP/packages"
          cp dist/*Setup*.exe "$RUNNER_TEMP/packages/shell-electron-windows-x64-setup.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-electron-windows
          path: ${{ runner.temp }}/packages/shell-electron-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 3

  linux:
    name: linux ${{ matrix.shell }}
    needs: packages
    runs-on: ubuntu-latest
    # The packages are built on Debian 13 and need its glibc.
    container: debian:trixie
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [tauri, electron]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: packaging/install-tests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: Install / uninstall checks
        run: bash packaging/install-tests/linux.sh "${{ matrix.shell }}" packages

  windows:
    name: windows ${{ matrix.shell }}
    needs: [packages, electron-windows]
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [tauri, electron]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: packaging/install-tests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-electron-windows
          path: packages
      - name: Install / uninstall checks
        shell: pwsh
        run: ./packaging/install-tests/windows.ps1 -Shell ${{ matrix.shell }} -Installer packages/shell-${{ matrix.shell }}-windows-x64-setup.exe
