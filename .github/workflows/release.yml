name: Release

# Push a tag vMAJOR.MINOR.PATCH (the only version form core/updater accepts)
# to build unsigned artifacts into a DRAFT pre-release. Nothing here holds or
# needs the update root key: the owner signs the manifest bodies offline and
# publishes the draft by hand (docs/release/RELEASING.md).
#
# Trust split (GAP-20): the build jobs run third-party code (crates, npm
# packages, the Rust toolchain action) with a READ-ONLY token and no caches,
# so neither a poisoned cache nor a compromised dependency can touch the
# release. They hand their output over as workflow artifacts. Only the
# `publish` job can write, and it runs nothing but GitHub's own actions, the
# preinstalled gh/node and our own script.

on:
  push:
    tags: ["v*"]
  # Dry run (pull requests, or by hand on any branch, e.g. main before a tag):
  # builds everything as version 0.0.0 and runs the publish checks, but
  # publishes nothing (no job with write access runs).
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/collect-release.sh
      - .github/scripts/write-relay-config.mjs
      - .github/scripts/changelog-section.mjs
      - CHANGELOG.md
      - .github/scripts/manifest-body.mjs
      - .github/scripts/third-party-notices.mjs
      - .github/scripts/pe-imports.mjs
      - core/.cargo/config.toml
      - desktop/package.json
      - desktop/package-lock.json
      - desktop/build/**

permissions:
  contents: read

# Never cancel a half-uploaded release: a second push of the same tag waits.
# A newer push to a pull request replaces its dry run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  TAG: ${{ github.ref_name }}
  # Channel written into the manifest body. Closed alpha only, for now.
  CHANNEL: alpha
  # Must list exactly the desktop matrix's platforms. publish accepts these
  # and nothing else, so a build job can't slip an extra platform into the
  # manifest body the owner signs. macOS returns when it has a package.
  PLATFORMS: "windows-x86_64 linux-x86_64"

# Actions are pinned to full commit SHAs, same as ci.yml.

jobs:
  check:
    name: check tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH (no suffixes: core/updater rejects them)"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      # Every release carries its "what changed" notes: no section, no build.
      - name: CHANGELOG section for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            node .github/scripts/changelog-section.mjs "$VERSION" > /dev/null
            echo "CHANGELOG.md has a section for $VERSION"
          else
            # Dry run: the newest section must still be readable.
            newest=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
            node .github/scripts/changelog-section.mjs "$newest" > /dev/null
            echo "dry run: newest CHANGELOG section ($newest) is readable"
          fi

  ui:
    name: ui build
    needs: check
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache: release builds start clean.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Licence policy (lockfile, before installing anything)
        working-directory: ui
        run: |
          # Added to the repo by the CI-hardening PR; skip until it lands.
          if [ -f ../.github/scripts/npm-licenses.mjs ]; then
            node ../.github/scripts/npm-licenses.mjs package-lock.json
          else
            echo "::warning::npm-licenses.mjs not on this commit; licence check skipped"
          fi
      - name: Build
        working-directory: ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Archive
        run: |
          mkdir -p out
          tar -czf "out/mvs-ui-${VERSION}.tar.gz" -C ui/dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui
          path: out/
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: desktop ${{ matrix.platform }}
    needs: [check, ui]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Platform names are the keys of the manifest's `artifacts` map.
          # Windows is built natively: electron-builder's NSIS step needs
          # wine anywhere else.
          - { platform: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, core: mvs-core.exe, crates: "api,updater" }
          # Oldest still-supported runner = oldest glibc we link against.
          - { platform: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, core: mvs-core, crates: api }
    env:
      VERSION: ${{ needs.check.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: "1.90"
          targets: ${{ matrix.target }}
      # No rust-cache and no npm cache on purpose (GAP-20): a cache written
      # by any PR build could otherwise end up inside a release binary.

      - name: Build the core sidecar (mvs-core)
        working-directory: core
        env:
          # The app's own version: without it the core can't judge "newer"
          # and in-app updates stay off (B8-5, #211).
          MVS_APP_VERSION: ${{ env.VERSION }}
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" -p api --bin mvs-core
          mkdir -p ../desktop/.core
          cp "target/${{ matrix.target }}/release/${{ matrix.core }}" ../desktop/.core/

      # The stable launcher next to the app ($INSTDIR\mvs-launcher.exe, via
      # desktop's extraFiles): it starts the healthy version, and rolls back to
      # the base copy. MVS_BASE_VERSION must be the version this installer
      # ships, or it always starts the base copy. Windows only for now. It is
      # never part of the updater payload (excluded in Collect).
      - name: Build the launcher (mvs-launcher)
        if: startsWith(matrix.platform, 'windows-')
        working-directory: core
        env:
          MVS_BASE_VERSION: ${{ env.VERSION }}
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" -p updater --bin mvs-launcher
          cp "target/${{ matrix.target }}/release/mvs-launcher.exe" ../desktop/.core/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui
          path: ui-artifact
      - name: Unpack ui/dist
        run: |
          mkdir -p ui/dist
          tar -xzf "ui-artifact/mvs-ui-${VERSION}.tar.gz" -C ui/dist

      # Relay address baked into the app. It lives in the repository
      # variable MVS_RELAY_ADDR (Settings -> Variables), never in git: it
      # contains the owner's domain. Without it the app runs offline.
      # Only a tag build reads it: pull-request dry runs (public artifacts on
      # a public repo) always get {}, and the dry-run job asserts that.
      #
      # MSYS2_ENV_CONV_EXCL / MSYS_NO_PATHCONV: on the Windows runner, Git Bash
      # would otherwise rewrite "/dns4/..." into "C:/Program Files/Git/dns4/..."
      # before node.exe sees it (this broke the first v0.2.0 tag build).
      - name: Relay config survives this runner's shell (self-test, dry runs)
        if: github.event_name != 'push'
        env:
          RELAY: /dns4/relay.example.invalid/tcp/443/wss/p2p/12D3KooWBVzkbuxE3TA4LU7zEeMBM87G4Ns1KQoPdAc4MR8R3GTc
          MSYS2_ENV_CONV_EXCL: RELAY
          MSYS_NO_PATHCONV: "1"
        run: |
          # Relay only: no bootstrap key.
          node .github/scripts/write-relay-config.mjs "$RUNNER_TEMP/relay-selftest.json"
          want='{"relay":"/dns4/relay.example.invalid/tcp/443/wss/p2p/12D3KooWBVzkbuxE3TA4LU7zEeMBM87G4Ns1KQoPdAc4MR8R3GTc"}'
          got=$(cat "$RUNNER_TEMP/relay-selftest.json")
          [ "$got" = "$want" ] || { echo "::error::relay config was altered on the way: $got"; exit 1; }
          # Relay plus TCP bootstrap.
          RELAY_TCP=/dns4/tcp.relay.example.invalid/tcp/4001/p2p/12D3KooWBVzkbuxE3TA4LU7zEeMBM87G4Ns1KQoPdAc4MR8R3GTc \
            node .github/scripts/write-relay-config.mjs "$RUNNER_TEMP/relay-selftest.json"
          want='{"relay":"/dns4/relay.example.invalid/tcp/443/wss/p2p/12D3KooWBVzkbuxE3TA4LU7zEeMBM87G4Ns1KQoPdAc4MR8R3GTc","bootstrap":["/dns4/tcp.relay.example.invalid/tcp/4001/p2p/12D3KooWBVzkbuxE3TA4LU7zEeMBM87G4Ns1KQoPdAc4MR8R3GTc"]}'
          got=$(cat "$RUNNER_TEMP/relay-selftest.json")
          [ "$got" = "$want" ] || { echo "::error::bootstrap config was altered on the way: $got"; exit 1; }
          # Relay plus STUN (the cases above have no stun key).
          STUN=stun:stun.relay.example.invalid:3478 \
            node .github/scripts/write-relay-config.mjs "$RUNNER_TEMP/relay-selftest.json"
          want='{"relay":"/dns4/relay.example.invalid/tcp/443/wss/p2p/12D3KooWBVzkbuxE3TA4LU7zEeMBM87G4Ns1KQoPdAc4MR8R3GTc","stun":"stun:stun.relay.example.invalid:3478"}'
          got=$(cat "$RUNNER_TEMP/relay-selftest.json")
          [ "$got" = "$want" ] || { echo "::error::stun config was altered on the way: $got"; exit 1; }
          echo "ok: relay, bootstrap and stun reach the config unchanged"
      - name: Build-time config (relay)
        env:
          RELAY: ${{ github.event_name == 'push' && vars.MVS_RELAY_ADDR || '' }}
          # Plain-TCP route to the relay (DCUtR, #219); optional.
          RELAY_TCP: ${{ github.event_name == 'push' && vars.MVS_RELAY_TCP_ADDR || '' }}
          # Our own STUN server for voice (stun:<host>:3478); optional.
          STUN: ${{ github.event_name == 'push' && vars.MVS_STUN_URL || '' }}
          MSYS2_ENV_CONV_EXCL: RELAY
          MSYS_NO_PATHCONV: "1"
        run: |
          node .github/scripts/write-relay-config.mjs desktop/build/mvs-config.json
          if [ "$GITHUB_EVENT_NAME" != push ] && [ "$(cat desktop/build/mvs-config.json)" != "{}" ]; then
            echo "::error::a non-tag build must not carry a relay address"; exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # T22: third-party notices for everything this installer ships, from the
      # lockfiles: the core's Rust crates for this platform (normal deps of the
      # binaries built above) and the ui's npm packages (bundled by Vite).
      # Electron/Chromium ship their own LICENSE.electron.txt and
      # LICENSES.chromium.html (checked in Collect). The ui install here is
      # only for its packages' licence files; ui/dist comes from the ui job.
      - name: Third-party notices
        run: |
          parts="$RUNNER_TEMP/notices"
          mkdir -p "$parts"
          (cd core && cargo metadata --format-version 1 --locked --filter-platform "${{ matrix.target }}" > "$parts/metadata.json")
          node .github/scripts/third-party-notices.mjs cargo "$parts/metadata.json" "${{ matrix.crates }}" "$parts/core (Rust crates).txt"
          (cd ui && npm ci --ignore-scripts --no-audit --no-fund)
          node .github/scripts/third-party-notices.mjs npm ui/package-lock.json ui "$parts/ui (npm packages).txt"
          node .github/scripts/third-party-notices.mjs merge desktop/build/THIRD-PARTY-NOTICES.txt "$parts/core (Rust crates).txt" "$parts/ui (npm packages).txt"

      - name: Package (electron-builder, unsigned)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned on purpose (closed alpha)
        run: |
          npm ci --no-audit --no-fund
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          case "${{ matrix.platform }}" in
            windows-*) npx electron-builder --win nsis --x64 --publish never ;;
            linux-*) npx electron-builder --linux AppImage deb --x64 --publish never ;;
          esac

      # Every Windows binary we ship must start on a clean install, without the
      # VC++ Redistributable (v0.3.0: "VCRUNTIME140.dll was not found" from
      # mvs-launcher).
      # Our Rust binaries get +crt-static from core/.cargo/config.toml.
      - name: No VC++ runtime imports (Windows)
        if: startsWith(matrix.platform, 'windows-')
        run: |
          shopt -s nullglob
          # Ours, strictly (no C runtime import at all): .core/ and the copies in the
          # app. Then every .exe and .dll in the app and the setup: no VC++
          # Redistributable import (Electron's dxil.dll uses the UCRT, which
          # ships with Windows 10+).
          node .github/scripts/pe-imports.mjs desktop/.core desktop/dist/win-unpacked/mvs-launcher.exe desktop/dist/win-unpacked/resources/mvs-core.exe \
            --third-party desktop/dist/win-unpacked desktop/dist/*Setup*.exe

      # Release names. The updater payload is the unpacked app folder
      # (win-unpacked / linux-unpacked, contents at the archive root) with no
      # installer and no mvs-launcher, which the updater keeps outside the app.
      # Its name mvs-<version>-<platform>.zip|.tar.gz is how manifest-body.mjs
      # finds it.
      - name: Collect
        run: |
          one() { # the expanded glob -> its single match, or fail
            [ $# -eq 1 ] && [ -f "$1" ] || { echo "::error::expected one file, got: $*"; ls -l desktop/dist; exit 1; }
            echo "$1"
          }
          base="mvs-${VERSION}-${{ matrix.platform }}"
          mkdir -p out
          shopt -s nullglob
          # Licences ship inside the app (T22): ours generated above, Electron's own.
          for f in resources/THIRD-PARTY-NOTICES.txt LICENSE.electron.txt LICENSES.chromium.html; do
            for d in desktop/dist/*-unpacked; do
              [ -s "$d/$f" ] || { echo "::error::$f missing from $d"; exit 1; }
            done
          done
          case "${{ matrix.platform }}" in
            windows-*)
              cp "$(one desktop/dist/*Setup*.exe)" "out/${base}-setup.exe"
              (cd desktop/dist/win-unpacked && 7z a -tzip "../../../out/${base}.zip" . -xr'!mvs-launcher*' > /dev/null)
              # The installer ships the launcher; the updater payload must not.
              [ -f desktop/dist/win-unpacked/mvs-launcher.exe ] || { echo "::error::mvs-launcher.exe missing from the app"; exit 1; }
              if 7z l "out/${base}.zip" | grep -qi 'mvs-launcher'; then echo "::error::mvs-launcher in the updater payload"; exit 1; fi ;;
            linux-*)
              cp "$(one desktop/dist/*.AppImage)" "out/${base}.AppImage"
              cp "$(one desktop/dist/*.deb)" "out/${base}.deb"
              tar -czf "out/${base}.tar.gz" -C desktop/dist/linux-unpacked --exclude='mvs-launcher*' . ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    # The only job with write access. It runs no third-party code: GitHub's
    # own checkout/download-artifact actions, the runner's preinstalled gh
    # and node, and .github/scripts/manifest-body.mjs (Node built-ins only).
    name: draft pre-release
    if: github.event_name == 'push'
    needs: [check, ui, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      # No merge-multiple: each artifact lands in its own artifacts/<name>/,
      # so one build job can't overwrite another's file.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Check artifacts, SHA256SUMS, manifest bodies (unsigned)
        run: bash .github/scripts/collect-release.sh "$VERSION" "$CHANNEL" "$PLATFORMS"
      - name: Create or update the draft
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft > is_draft 2>/dev/null; then
            if [ "$(cat is_draft)" != "true" ]; then
              echo "::error::release $TAG is already published; refusing to replace its assets"
              exit 1
            fi
            echo "draft $TAG exists (re-run), replacing its assets"
          else
            # What changed (CHANGELOG.md), then how to install and verify.
            node .github/scripts/changelog-section.mjs "$VERSION" > notes.md
            printf '\n---\n\n' >> notes.md
            cat >> notes.md <<EOF
          **Closed alpha - unsigned build. Only install it if you were invited.**

          | System | Download |
          | --- | --- |
          | Windows 10/11 (per user, no admin) | \`mvs-${VERSION}-windows-x86_64-setup.exe\` |
          | Linux, any distro (no install) | \`mvs-${VERSION}-linux-x86_64.AppImage\` |
          | Debian/Ubuntu | \`mvs-${VERSION}-linux-x86_64.deb\` |

          How to install and get started (Hebrew):
          [docs/release/ALPHA-QUICKSTART.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/release/ALPHA-QUICKSTART.md)

          - **Alpha:** the data format may still change. Servers and messages made with this build may be reset by a later one. Your identity is safe as long as you keep your 12 recovery words.
          - The installers are **not code-signed**. Windows SmartScreen will warn: choose "More info" and then "Run anyway".
          - **Windows firewall:** the first time MVS starts, Windows asks whether to allow it on your networks. Choose **Allow** (private networks are enough). MVS works either way: if it is blocked, messages go through the MVS relay, but direct connections to members are lost and voice calls may not connect. To allow it later: Windows Security, Firewall & network protection, "Allow an app through firewall", "Change settings", then tick MVS (this step needs an administrator account). MVS never changes firewall settings itself.
          - The \`.zip\`/\`.tar.gz\` files are the in-app updater payloads; you don't need them.
          - \`manifest-body-beta.json\` / \`manifest-body-alpha.json\` are the **unsigned** update manifests per channel. The owner signs them offline and publishes them to the \`update-beta\` / \`update-alpha\` releases; until then, in-app updates are not offered.
          - Built by GitHub Actions from \`${GITHUB_SHA}\`. Check downloads against \`SHA256SUMS\`.
          EOF
            gh release create "$TAG" --draft --prerelease --verify-tag \
              --title "MVS ${TAG} (closed alpha)" --notes-file notes.md
          fi
          # The explicit list: the ui archive, the installers and updater
          # payloads checked above, SHA256SUMS, manifest-body-{beta,alpha}.json.
          mapfile -t files < files
          (cd dist && gh release upload "$TAG" "${files[@]}" --clobber)
      - name: Summary
        run: |
          {
            echo "### Draft pre-release ${TAG} is ready for signing"
            echo
            echo "Owner: follow docs/release/RELEASING.md (sign offline, upload manifest.json, publish)."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dry-run:
    # Anything but a tag push: the same checks as publish, read-only, uploads nothing.
    name: release dry run
    if: github.event_name != 'push'
    needs: [check, ui, desktop]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Check artifacts, SHA256SUMS, manifest bodies (unsigned)
        run: bash .github/scripts/collect-release.sh "$VERSION" "$CHANNEL" "$PLATFORMS"
      - name: No relay address in dry-run builds
        run: |
          # The packaged app's resources/mvs-config.json must be {} (or absent,
          # while desktop/ doesn't package it yet).
          mkdir -p probe/win probe/linux
          unzip -q -o "dist/mvs-${VERSION}-windows-x86_64.zip" 'resources/mvs-config.json' -d probe/win 2>/dev/null || true
          tar -xzf "dist/mvs-${VERSION}-linux-x86_64.tar.gz" -C probe/linux ./resources/mvs-config.json 2>/dev/null || true
          for c in probe/win/resources/mvs-config.json probe/linux/resources/mvs-config.json; do
            if [ -f "$c" ]; then
              [ "$(cat "$c")" = "{}" ] || { echo "::error::$c is not {}"; exit 1; }
              echo "ok: $c is {}"
            else
              echo "not packaged yet: $c"
            fi
          done
      - name: Files that a tag would publish
        run: cat files
