name: Release

# Push a tag vMAJOR.MINOR.PATCH (the only version form core/updater accepts)
# to build unsigned artifacts into a DRAFT pre-release. Nothing here holds or
# needs the update root key: the owner signs manifest-body.json offline and
# publishes the draft by hand (docs/release/RELEASING.md).
#
# Trust split (GAP-20): the build jobs run third-party code (crates, npm
# packages, the Rust toolchain action) with a READ-ONLY token and no caches,
# so neither a poisoned cache nor a compromised dependency can touch the
# release. They hand their output over as workflow artifacts. Only the
# `publish` job can write, and it runs nothing but GitHub's own actions, the
# preinstalled gh/node and our own script.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never cancel a half-uploaded release; a second push of the same tag waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  TAG: ${{ github.ref_name }}
  # Channel written into the manifest body. Closed alpha only, for now.
  CHANNEL: alpha
  # Binaries from core/ shipped in each platform archive.
  CORE_BINS: "updater spike-peer sync-peer"
  # Must list exactly the core matrix's platforms. publish accepts these and
  # nothing else, so a build job can't slip an extra platform into the
  # manifest body the owner signs.
  PLATFORMS: "windows-x86_64 macos-x86_64 macos-aarch64 linux-x86_64"

# Actions are pinned to full commit SHAs, same as ci.yml.

jobs:
  check:
    name: check tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH (no suffixes: core/updater rejects them)"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  ui:
    name: ui build
    needs: check
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # No npm cache: release builds start clean.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Licence policy (lockfile, before installing anything)
        working-directory: ui
        run: |
          # Added to the repo by the CI-hardening PR; skip until it lands.
          if [ -f ../.github/scripts/npm-licenses.mjs ]; then
            node ../.github/scripts/npm-licenses.mjs package-lock.json
          else
            echo "::warning::npm-licenses.mjs not on this commit; licence check skipped"
          fi
      - name: Build
        working-directory: ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Archive
        run: |
          mkdir -p out
          tar -czf "out/mvs-ui-${VERSION}.tar.gz" -C ui/dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui
          path: out/
          if-no-files-found: error
          retention-days: 7

  core:
    name: core ${{ matrix.platform }}
    needs: [check, ui]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Platform names are the keys of the manifest's `artifacts` map.
          - { platform: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, exe: ".exe" }
          # Intel macOS is cross-compiled on the Apple Silicon runner.
          - { platform: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, exe: "" }
          - { platform: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, exe: "" }
          # Oldest still-supported runner = oldest glibc we link against.
          - { platform: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, exe: "" }
    env:
      VERSION: ${{ needs.check.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: "1.90"
          targets: ${{ matrix.target }}
      # No rust-cache here on purpose (GAP-20): a cache written by any PR
      # build could otherwise end up inside a release binary.

      - name: Build core
        working-directory: core
        run: cargo build --release --locked --target "${{ matrix.target }}" --bins

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui
          path: stage

      - name: Stage files
        run: |
          stage="stage/mvs-${VERSION}-${{ matrix.platform }}"
          mkdir -p "$stage/bin" "$stage/ui"
          for bin in $CORE_BINS; do
            cp "core/target/${{ matrix.target }}/release/${bin}${{ matrix.exe }}" "$stage/bin/"
          done
          tar -xzf "stage/mvs-ui-${VERSION}.tar.gz" -C "$stage/ui"
          printf 'MVS %s (%s), closed alpha, UNSIGNED.\nBuilt from %s.\n' \
            "$VERSION" "${{ matrix.platform }}" "$GITHUB_SHA" > "$stage/README.txt"

      # ------------------------------------------------------------------
      # SHELL PACKAGING PLUG-IN POINT
      #
      # Until the desktop shell is chosen, the updater artifact is the plain
      # archive built by "Package (no shell yet)". Once it is, set the repo
      # variable MVS_SHELL to `tauri` or `electron`, flesh out the matching
      # step below and delete the other one. Whatever it produces MUST be
      # renamed to dist/mvs-<version>-<platform>.zip|.tar.gz: that file name
      # is how manifest-body.mjs finds the updater artifact for a platform.
      # Installers (.msi/.dmg/.AppImage) can go into dist/ alongside it under
      # any other name. This job has a read-only token: packaging tools must
      # not need to write to the repo. All of it stays unsigned until
      # code-signing certs exist (no CSC_* / APPLE_* / TAURI_SIGNING_* secrets).
      # ------------------------------------------------------------------
      - name: "[shell] Tauri bundle (sketch)"
        if: vars.MVS_SHELL == 'tauri'
        run: |
          # Linux needs: sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          # shell/tauri/src-tauri/tauri.conf.json: frontendDist -> ../../ui/dist (reuse stage/.../ui),
          # bundle.externalBin -> the core sidecar binaries from stage/.../bin.
          cd shell/tauri
          npm ci --ignore-scripts
          npx tauri build --target "${{ matrix.target }}" --ci
          # The updater payload is the app bundle archive, not the installer:
          #   windows: bundle/nsis/*.exe   macOS: bundle/macos/*.app (tar it)   linux: bundle/appimage/*.AppImage
          # mkdir -p ../../dist && tar/zip it to ../../dist/mvs-${VERSION}-${{ matrix.platform }}.<ext>
          echo "::error::Tauri packaging is a sketch; finish it before setting MVS_SHELL=tauri"; exit 1

      - name: "[shell] Electron bundle (sketch)"
        if: vars.MVS_SHELL == 'electron'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned on purpose
        run: |
          # shell/electron/electron-builder.yml: files -> ui dist, extraResources -> stage/.../bin
          cd shell/electron
          npm ci --ignore-scripts
          case "${{ matrix.platform }}" in
            windows-*) npx electron-builder --win nsis zip --x64 --publish never ;;
            macos-x86_64) npx electron-builder --mac dmg zip --x64 --publish never ;;
            macos-aarch64) npx electron-builder --mac dmg zip --arm64 --publish never ;;
            linux-*) npx electron-builder --linux AppImage tar.gz --x64 --publish never ;;
          esac
          # The zip/tar.gz from dist/ is the updater payload:
          # mv it to ../../dist/mvs-${VERSION}-${{ matrix.platform }}.<ext>
          echo "::error::Electron packaging is a sketch; finish it before setting MVS_SHELL=electron"; exit 1

      - name: Package (no shell yet)
        if: vars.MVS_SHELL == ''
        run: |
          name="mvs-${VERSION}-${{ matrix.platform }}"
          mkdir -p dist
          if [ "${{ matrix.exe }}" = ".exe" ]; then
            (cd stage && 7z a -tzip "../dist/${name}.zip" "$name" > /dev/null)
          else
            tar -czf "dist/${name}.tar.gz" -C stage "$name"
          fi
      # ------------------------------------------------------------------

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    # The only job with write access. It runs no third-party code: GitHub's
    # own checkout/download-artifact actions, the runner's preinstalled gh
    # and node, and .github/scripts/manifest-body.mjs (Node built-ins only).
    name: draft pre-release
    needs: [check, ui, core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      # No merge-multiple: each artifact lands in its own artifacts/<name>/,
      # so one build job can't overwrite another's file.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Check artifacts, collect release files
        run: |
          # Exactly one expected file per expected artifact, nothing else.
          expect="ui=mvs-ui-${VERSION}.tar.gz"
          for p in $PLATFORMS; do
            case "$p" in windows-*) ext=zip ;; *) ext=tar.gz ;; esac
            expect="$expect core-$p=mvs-${VERSION}-$p.$ext"
          done
          want_dirs=$(for e in $expect; do echo "${e%%=*}"; done | sort)
          have_dirs=$(find artifacts -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          if [ "$have_dirs" != "$want_dirs" ]; then
            echo "::error::unexpected artifact set:"; echo "$have_dirs"; exit 1
          fi
          mkdir dist
          : > files
          for e in $expect; do
            name="${e%%=*}" file="${e#*=}"
            if [ "$(find "artifacts/$name" -mindepth 1 -printf '%P\n')" != "$file" ] || [ ! -f "artifacts/$name/$file" ] || [ -L "artifacts/$name/$file" ]; then
              echo "::error::artifact $name must hold exactly $file, has:"; ls -lA "artifacts/$name"; exit 1
            fi
            cp "artifacts/$name/$file" dist/
            echo "$file" >> files
          done
          ls -l dist
      - name: SHA256SUMS
        working-directory: dist
        run: |
          mapfile -t files < ../files
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: manifest-body.json (unsigned)
        run: |
          node .github/scripts/manifest-body.mjs --version "$VERSION" --channel "$CHANNEL" \
            --platforms "$PLATFORMS" --dir dist --days 14 --out dist/manifest-body.json
          cat dist/manifest-body.json
          echo SHA256SUMS >> files
          echo manifest-body.json >> files
      - name: Create or update the draft
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft > is_draft 2>/dev/null; then
            if [ "$(cat is_draft)" != "true" ]; then
              echo "::error::release $TAG is already published; refusing to replace its assets"
              exit 1
            fi
            echo "draft $TAG exists (re-run), replacing its assets"
          else
            cat > notes.md <<EOF
          **Closed alpha - unsigned build. Only install it if you were invited.**

          Built by GitHub Actions from \`${GITHUB_SHA}\`. Check downloads against \`SHA256SUMS\`.
          \`manifest.json\` (signed offline by the owner) is attached before this is published.
          EOF
            gh release create "$TAG" --draft --prerelease --verify-tag \
              --title "MVS ${TAG} (closed alpha)" --notes-file notes.md
          fi
          # The explicit list: 5 archives, SHA256SUMS, manifest-body.json.
          mapfile -t files < files
          (cd dist && gh release upload "$TAG" "${files[@]}" --clobber)
      - name: Summary
        run: |
          {
            echo "### Draft pre-release ${TAG} is ready for signing"
            echo
            echo "Owner: follow docs/release/RELEASING.md (sign offline, upload manifest.json, publish)."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
