[package]
name = "api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
identity = { path = "../identity" }
records = { path = "../records" }
groupkeys = { path = "../groupkeys" }
authority = { path = "../authority" }
# The P2P layer; core/api is its integration layer (T1).
sync = { path = "../sync" }
# In-app update (B8-5): every verification stays in that crate.
updater = { path = "../updater" }
# Same versions as `sync`: its runtime and its address type.
anyhow = "1"
libp2p = { version = "0.56", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
# BSD-3-Clause
ed25519-dalek = "2"
# CC0-1.0 OR Apache-2.0
blake3 = "1"
# MIT OR Apache-2.0
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
# MIT OR Apache-2.0. Already in the tree (libp2p-identity); T8-02 invite links.
bs58 = "0.5"
zeroize = "1"
# MIT. SQLite itself is public domain. Same version and features as `sync`.
rusqlite = { version = "0.32", features = ["bundled"] }
# MIT. Same versions as `sync`; RUST_LOG for the binary (stderr only).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MIT OR Apache-2.0. Sets the data dir's ACL through its handle (as `sync`'s
# key file does).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# MIT. Same version as `sync`, with the features its own relay test uses: an
# in-process relay for the voice test in `two_peers.rs` (no new crates).
libp2p = { version = "0.56", default-features = false, features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "relay",
    "identify",
    "ping",
    "kad",
    "macros",
] }
# MIT. Same version and features as `updater`: builds test update payloads.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
