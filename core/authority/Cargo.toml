[package]
name = "authority"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
records = { path = "../records" }
# MIT OR Apache-2.0. The ServerEdit body is JSON (server lifecycle).
serde = { version = "1", features = ["derive"] }
# MIT OR Apache-2.0
serde_json = "1"

[dev-dependencies]
# OsRng for sealing; the same rand_core as groupkeys and api.
rand_core = { version = "0.6", features = ["getrandom"] }
# The sealed-message size test seals a real message.
groupkeys = { path = "../groupkeys" }
