# cargo-deny policy: `cargo deny check licenses sources` (runs in CI).
# Follows the licence policy in docs/spec.md: the app is sold and
# distributed commercially, so only permissive licences are allowed.

[graph]
# Check what we ship on every desktop and mobile target, not only the
# machine running the check.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-linux-android",
    "aarch64-apple-ios",
]

[licenses]
version = 2
# Anything not listed is rejected. That is how GPL, AGPL, SSPL,
# non-commercial licences and crates with no licence are denied; there is
# no separate deny list in cargo-deny v2.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    # Architect approval only, and only while the crate's files stay
    # unmodified (we never vendor or patch an MPL crate).
    "MPL-2.0",
]
confidence-threshold = 0.93

# LGPL is never allowed in general. A crate may be let in only as a named
# exception after architect review, and only if it is linked dynamically
# and left unmodified (spec: e.g. WebKitGTK on Linux). Template:
#
# exceptions = [
#     # <why we need it>; dynamically linked, unmodified. Approved by <who>, <date>.
#     { allow = ["LGPL-2.1-or-later"], crate = "<crate-name>" },
# ]

# ACCEPTED EXCEPTION - approved by the owner (Nov 2026). Scoped to this one
# crate and version only; any other OpenSSL-licensed crate still fails.
# ring 0.16.20 has no licence field. Its LICENSE file is ISC (ring's own
# code) + MIT (fiat) + the OpenSSL and SSLeay licences (code inherited from
# OpenSSL). OpenSSL/SSLeay are permissive and allow commercial use; their
# acknowledgement clause goes into the third-party notices file.
# It comes in only through libp2p 0.54: libp2p-quic -> libp2p-tls 0.5 ->
# rcgen 0.11 -> ring 0.16. Newer libp2p-tls uses rcgen 0.13 / ring 0.17
# (Apache-2.0 AND ISC); after a libp2p upgrade this entry becomes unused and
# can be removed.
[[licenses.clarify]]
crate = "ring@0.16.20"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[[licenses.exceptions]]
crate = "ring@0.16.20"
allow = ["OpenSSL"]
# Since T3 (libp2p 0.56) core no longer has ring 0.16; infra/relay (checked
# against this file too) still does until its own libp2p upgrade (devops).
# Remove both entries above after that.

# PROPOSED EXCEPTION - needs owner approval (T3 PR). Scoped to this one crate.
# webpki-roots 1.x is the Mozilla root store as data, under the Community
# Data License Agreement Permissive 2.0: permissive, commercial use allowed,
# no copyleft; the only condition is passing on the licence text, which goes
# into the third-party notices file. It comes in through libp2p 0.56:
# libp2p-websocket 0.45 (our /wss link to the relay) -> webpki-roots 1.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# Our own workspace crates are `publish = false` and carry no licence field.
[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
version = 2
