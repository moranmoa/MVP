[package]
name = "groupkeys"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Types only: PublicKey, RecordId, ServerId, ChannelId, Kind (for limits).
records = { path = "../records" }
# BSD-3-Clause. Ed25519 identity -> X25519 conversion.
ed25519-dalek = "2.1"
# BSD-3-Clause. X25519 on the Montgomery form.
curve25519-dalek = "5.0"
# Apache-2.0 OR MIT. RustCrypto AEAD, audited by NCC Group (2020).
chacha20poly1305 = "0.10"
# CC0-1.0 OR Apache-2.0. KDF (derive_key mode).
blake3 = "1"
# MIT OR Apache-2.0
rand_core = { version = "0.6", features = ["getrandom"] }
# Apache-2.0 OR MIT
zeroize = "1"

[dev-dependencies]
# MIT OR Apache-2.0
proptest = "1"
# MIT OR Apache-2.0
rand_chacha = "0.3"
