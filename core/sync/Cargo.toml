[package]
name = "sync"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "sync-peer"
path = "harness/peer.rs"

[[bin]]
name = "sync-harness"
path = "harness/coordinator.rs"

[dependencies]
anyhow = "1"
# The request-response codec trait (`voice`); already in the tree through libp2p.
async-trait = "0.1"
blake3 = "1"
chacha20poly1305 = "0.11"
# Test and harness keys only (the app gets keys from core/identity).
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = "0.3"
libp2p = { version = "0.56", features = [
    "tokio",
    "tcp",
    # QUIC (`/udp/<port>/quic-v1`) beside TCP: the direct path hole punching
    # can open on Windows too (TCP simultaneous open never completes there).
    "quic",
    # /wss to the relay behind Cloudflare: TLS by rustls with webpki roots
    # (libp2p-websocket's client config), no native-tls.
    "websocket",
    "dns",
    "noise",
    "yamux",
    "relay",
    # Hole punching with members only (`punch`).
    "dcutr",
    "identify",
    "ping",
    "kad",
    "gossipsub",
    "request-response",
    "cbor",
    "macros",
] }
rand_core = { version = "0.6", features = ["getrandom"] }
records = { path = "../records" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }

# Owner-only ACL for the node key (same as core/updater).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }
