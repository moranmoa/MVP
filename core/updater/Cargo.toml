[package]
name = "updater"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# MIT. Reads the update payload (Windows .zip): deflate only, pure Rust
# (flate2 with miniz_oxide); no encryption or other codecs.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# MIT OR Apache-2.0. HTTPS for the update source (B8-4): rustls with ring,
# OS certificate store (no bundled root list), no cookies, no gzip.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# MIT OR Apache-2.0. Sets the secret key file's ACL through its handle.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }

# MIT OR Apache-2.0. O_NOFOLLOW for unpacked files (already in the tree).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
