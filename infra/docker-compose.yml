services:
  # Bootstrap (DHT) + circuit relay. Needed from the closed alpha.
  relay:
    build: ./relay
    restart: unless-stopped
    environment:
      KEY_PATH: /data/node.key
      EXTERNAL_ADDRS: ${EXTERNAL_ADDRS:-}
      RUST_LOG: ${RUST_LOG:-info}
      # Circuit limits; empty keeps libp2p's defaults. See .env.example.
      MAX_CIRCUITS: ${MAX_CIRCUITS:-}
      MAX_CIRCUITS_PER_PEER: ${MAX_CIRCUITS_PER_PEER:-}
      MAX_CIRCUIT_SECS: ${MAX_CIRCUIT_SECS:-}
      MAX_CIRCUIT_BYTES: ${MAX_CIRCUIT_BYTES:-}
    ports:
      - "4001:4001/tcp"
      - "4001:4001/udp"
      # WebSocket for browsers - only the reverse proxy on this PC talks to it.
      - "${WS_BIND:-127.0.0.1}:4002:4002/tcp"
    volumes:
      - relay-data:/data

  # TURN for voice and the Web client (phase 2). Start with: --profile voice
  coturn:
    image: coturn/coturn:4.6.2
    profiles: ["voice"]
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --no-cli
      - --fingerprint
      - --use-auth-secret
      # Set TURN_SECRET, DOMAIN and PUBLIC_IP in .env before using this profile.
      - --static-auth-secret=${TURN_SECRET:-}
      - --realm=${DOMAIN:-}
      - --external-ip=${PUBLIC_IP:-}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

volumes:
  relay-data:
