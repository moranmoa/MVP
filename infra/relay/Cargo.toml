[package]
name = "relay-node"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
# The backup mailbox (/mvs/backup/1): the same checks as core/sync's holder.
blake3 = "=1.8.7"
ed25519-dalek = "2.2"
futures = "0.3"
libp2p = { version = "0.54", features = [
    "tokio",
    "tcp",
    "quic",
    "noise",
    "yamux",
    "dns",
    "websocket",
    "identify",
    "ping",
    "relay",
    "kad",
    "macros",
    "memory-connection-limits",
    "request-response",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
