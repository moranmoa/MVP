# QA suite. Nothing needs Node or a browser on the host.
#
#   docker compose -f qa/compose.yaml run --rm smoke     # smoke suite
#   docker compose -f qa/compose.yaml run --rm explore   # exploratory checks + bug repros
#   docker compose -f qa/compose.yaml down               # stop the UI server
#
# The `ui` service builds ../ui and serves it with `vite preview` (mock
# core). The test services join its network namespace, so the app is at
# http://localhost:5173 for them and Vite's host check does not get in the way.
name: mvs-qa

services:
  ui:
    image: node:22.23.4-bookworm
    working_dir: /app
    volumes:
      - ../ui:/app
      - qa_ui_node_modules:/app/node_modules
    # A production build, so the timing checks measure what testers get.
    # It is built into /tmp, so nothing is written into the ui/ checkout.
    command: >-
      bash -c "npm ci --no-audit --no-fund
      && npx vite build --outDir /tmp/qa-dist --emptyOutDir --logLevel warn
      && npx vite preview --outDir /tmp/qa-dist --host 0.0.0.0 --port 5173 --strictPort"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5173/"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s

  smoke: &tests
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    working_dir: /qa
    network_mode: "service:ui"
    depends_on:
      ui:
        condition: service_healthy
    volumes:
      - .:/qa
      - qa_node_modules:/qa/node_modules
    ipc: host
    command: bash -c "npm ci --no-audit --no-fund && npx playwright test --project=smoke"

  explore:
    <<: *tests
    command: bash -c "npm ci --no-audit --no-fund && npx playwright test --project=explore"

volumes:
  qa_ui_node_modules:
  qa_node_modules:
